name: Windows ARM64 hardware report
description: Report a Windows on ARM (arm64) result — a bug, or a successful run that can feed the ARM64 signoff evidence record.
title: "[Windows ARM64]: "
labels:
  - windows
  - arm64
  - preview-support
body:
  - type: markdown
    attributes:
      value: |
        Windows ARM64 is the least validated openPREY target. Packages are produced by a manual release job on a
        native `windows-11-arm` runner, but **no openPREY Windows ARM64 binary has been started by automation**,
        and there is no per-push or per-PR Windows ARM64 CI lane. Every report from real hardware is valuable.

        Known rough edges to check before filing, so your report is not a duplicate:

        - **Renderer.** openPREY defaults to OpenGL, and stock Windows on ARM ships only Microsoft's generic
          GL 1.1 software driver, which is below openPREY's GL 3.3 baseline. If the client fails to start a
          renderer, try `+set r_renderApi vulkan`, and say in the report whether that changed anything.
        - **Audio.** The ARM64 OpenAL runtime is prepared separately from the x64 bundled payload. If you have
          no sound, or a missing-DLL error naming `OpenAL32.dll` or a VC++ runtime DLL, say so explicitly.

        Please paste terminal output and `openprey.log` as text rather than screenshots.
  - type: input
    id: version
    attributes:
      label: openPREY version
      description: The version string printed at startup, or the release tag you downloaded.
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Package artifact name
      description: Paste the exact downloaded file name, or say "built from source" and give the commit SHA.
      placeholder: "local source build at 0.0.1"
    validations:
      required: true
  - type: dropdown
    id: report_kind
    attributes:
      label: What kind of report is this?
      options:
        - Defect — something is broken
        - Clean run — reporting a working session as evidence
        - Performance observation
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Device and SoC
      placeholder: "Surface Laptop 7 / Snapdragon X Elite X1E-80-100"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      description: Run `winver` and paste the version and build.
      placeholder: "Windows 11 24H2, build 26100.2314"
    validations:
      required: true
  - type: dropdown
    id: emulation
    attributes:
      label: Which binary did you run?
      description: >-
        Windows on ARM transparently emulates x64. Confirm you are running the arm64 build — the file name
        carries the suffix, and Task Manager's Details tab has an "Architecture" column.
      options:
        - Native ARM64 build (openPREY-client_arm64.exe)
        - x64 build under emulation (openPREY-client_x64.exe)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - OpenGL (default)
        - Vulkan (r_renderApi vulkan)
        - Tried both
        - Never reached a renderer
    validations:
      required: true
  - type: input
    id: gl_provider
    attributes:
      label: OpenGL provider
      description: >-
        If you got as far as a GL context, paste the GL_RENDERER string openPREY logs at startup. This
        distinguishes the generic Microsoft software driver from the OpenGL Compatibility Pack's D3D12 layer
        from a real vendor driver.
      placeholder: "D3D12 (Qualcomm Adreno X1-85 GPU) / GDI Generic"
    validations:
      required: false
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: >-
        For a defect, describe the symptom and how to reproduce it. For a clean run, say what you did —
        which maps, single player or multiplayer, how long, and whether audio and input behaved.
    validations:
      required: true
  - type: textarea
    id: x64_comparison
    attributes:
      label: Does the same thing happen with the x64 build under emulation?
      description: >-
        This is the single most valuable field for an architecture report, because it separates an ARM64
        code defect from a general Windows-on-ARM platform issue. "Not tested" is a fine answer.
      placeholder: "Not tested / same under emulation / x64 emulated build is fine, only arm64 shows this"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Terminal output and openprey.log
      description: >-
        Paste as text. Include the startup banner — it carries the version, architecture, and CPU line. If the
        client crashed, also attach the crash log and minidump from the openPREY save directory.
      render: text
    validations:
      required: true
  - type: input
    id: machine_spec
    attributes:
      label: Reported machine quality tier
      description: >-
        Run `com_machineSpec` in the console and paste the value. Windows on ARM reports no CPU frequency, so
        this is a known problem area and the value is worth capturing.
      placeholder: "com_machineSpec = 2"
    validations:
      required: false
  - type: checkboxes
    id: evidence_consent
    attributes:
      label: Evidence record
      options:
        - label: >-
            This is a physical-hardware run and I am willing to have it referenced in a Windows ARM64 signoff
            evidence record.
          required: false
